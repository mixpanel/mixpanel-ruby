name: Ruby

on:
  push:
    branches: [ "master" ]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:

    # Pinned to 24.04: ubuntu-latest (26.04) only has prebuilt CRuby >= 3.2,
    # and this matrix still covers 3.0/3.1.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run tests
      run: bundle exec rake
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: mixpanel/mixpanel-ruby

  test-openfeature:

    # Pinned to 24.04: ubuntu-latest (26.04) only has prebuilt CRuby >= 3.2,
    # and this matrix still covers 3.1.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
    - name: Install dependencies
      run: cd openfeature-provider && bundle install
    - name: Run OpenFeature provider tests
      run: cd openfeature-provider && bundle exec rspec
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: mixpanel/mixpanel-ruby
        flags: openfeature
        directory: openfeature-provider
